# nfpm config for the .deb and .rpm packages, used by _build.sh/_build.bat.
# Paths are relative to the repo root; ${...} comes from the environment.
# nfpm does not expand variables in src, so the binary is staged in bin/.pkg/.
name: althex
arch: ${PKG_ARCH}
platform: linux
version: ${PKG_VERSION}
section: devel
priority: optional
maintainer: Ivan Poluianov <ipoluyanov@gmail.com>
description: AltHex - hex editor for files of any size, disks and firmware.
homepage: https://github.com/ipoluianov/althex
license: MIT

contents:
  - src: bin/.pkg/althex
    dst: /usr/bin/althex
    file_info:
      mode: 0755
  - src: build/althex.desktop
    dst: /usr/share/applications/althex.desktop
  - src: icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/althex.svg
  - src: icon.png
    dst: /usr/share/icons/hicolor/256x256/apps/althex.png

scripts:
  preremove: build/preremove.sh

# nui loads these with dlopen at runtime; only libX11 is mandatory
overrides:
  deb:
    depends: [libx11-6]
    recommends: [libxext6, libxinerama1, libfreetype6]
  rpm:
    depends: [libX11]
    recommends: [libXext, libXinerama, freetype]
